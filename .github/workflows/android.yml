name: Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  android-arm64:
    name: Android ARM64 NEON DotProd
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # =========================================================
      # SOURCE
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # ANDROID SDK / NDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # =========================================================
      # HOST TOOLS
      #
      # Halogen's verbatim program includes arm_neon.h.
      # Therefore it must be compiled with an AArch64 compiler,
      # not the normal x86-64 g++.
      #
      # It is then executed through QEMU.
      # =========================================================
      - name: Install AArch64 compiler and QEMU
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            qemu-user-static

          echo "AArch64 compiler:"
          which aarch64-linux-gnu-g++

          echo "QEMU:"
          which qemu-aarch64-static

      # =========================================================
      # ANDROID TOOLCHAIN
      # =========================================================
      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

      # =========================================================
      # NETWORK
      # =========================================================
      - name: Download Halogen network
        shell: bash
        run: |
          mkdir -p build

          curl -fL \
            "https://github.com/KierenP/Halogen-Networks/releases/download/ed164cf2/ed164cf2.nn" \
            -o build/ed164cf2.nn

          echo "Downloaded network:"
          ls -lh build/ed164cf2.nn

      # =========================================================
      # DIRECTORIES
      # =========================================================
      - name: Prepare build directories
        shell: bash
        run: |
          mkdir -p build/neon-dotprod
          mkdir -p bin

      # =========================================================
      # ANDROID COMPATIBILITY PATCH
      #
      # Android API 24 does not expose std::aligned_alloc in
      # libc++ in the same way as desktop Linux.
      #
      # Halogen's huge_pages.h therefore uses posix_memalign()
      # when __ANDROID__ is defined.
      # =========================================================
      - name: Patch Android memory allocation
        working-directory: src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("utility/huge_pages.h")
          text = path.read_text()

          # Add cstdlib if it isn't already present.
          if "#include <cstdlib>" not in text:
              if "#include <cstddef>" in text:
                  text = text.replace(
                      "#include <cstddef>",
                      "#include <cstddef>\n#include <cstdlib>",
                      1
                  )
              else:
                  text = "#include <cstdlib>\n" + text

          # We only patch the std::aligned_alloc expression.
          #
          # Android provides posix_memalign(), and this preserves
          # the required alignment without changing Halogen's
          # transposition-table architecture.
          old = """T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));"""

          new = """#ifdef __ANDROID__
    void* aligned_ptr = nullptr;

    if (posix_memalign(&aligned_ptr, huge_page_size, size) != 0)
        return nullptr;

    T* data = static_cast<T*>(aligned_ptr);
#else
    T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));
#endif"""

          if old in text:
              text = text.replace(old, new, 1)
              print("Patched std::aligned_alloc for Android.")
          elif "posix_memalign(&aligned_ptr" in text:
              print("Android aligned allocation patch already present.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected aligned_alloc line "
                  "in utility/huge_pages.h"
              )

          path.write_text(text)
          PY

          echo
          echo "===== patched huge_pages.h ====="
          grep -n -A18 -B8 "aligned_alloc\|posix_memalign" utility/huge_pages.h

      # =========================================================
      # BUILD ARM64 VERBATIM TOOL
      #
      # This is a Linux AArch64 HOST utility, NOT the Android
      # engine.
      #
      # It needs arm_neon.h, hence aarch64-linux-gnu-g++.
      # =========================================================
      - name: Build ARM64 verbatim tool
        working-directory: src
        shell: bash
        run: |
          aarch64-linux-gnu-g++ \
            -O3 \
            -std=c++20 \
            -fno-exceptions \
            -pthread \
            -I. \
            -DUSE_NEON \
            -DUSE_NEON_DOTPROD \
            -march=armv8.2-a+dotprod \
            tools/verbatim.cpp \
            -o ../build/neon-dotprod/verbatim \
            -lm

          echo
          echo "===== verbatim binary ====="
          file ../build/neon-dotprod/verbatim

      # =========================================================
      # GENERATE NEON/DOTPROD NNUE
      #
      # GitHub runner = x86-64
      # verbatim       = ARM64 Linux
      #
      # Therefore QEMU executes it.
      # =========================================================
      - name: Generate NEON DotProd network
        working-directory: src
        shell: bash
        run: |
          chmod +x ../build/neon-dotprod/verbatim

          qemu-aarch64-static \
            -L /usr/aarch64-linux-gnu \
            ../build/neon-dotprod/verbatim \
            ../build/ed164cf2.nn \
            ../build/neon-dotprod/verbatim.nn

          echo
          echo "===== generated network ====="
          ls -lh ../build/neon-dotprod/verbatim.nn

      # =========================================================
      # PREPARE MAKE
      #
      # Halogen's Makefile normally wants to build its own
      # verbatim executable. We already built it correctly for
      # ARM64 Linux, so make must see our copy as up-to-date.
      # =========================================================
      - name: Prepare Halogen verbatim files
        shell: bash
        run: |
          touch build/neon-dotprod/verbatim
          touch build/neon-dotprod/verbatim.nn

          echo "===== Halogen build files ====="
          ls -lh build/neon-dotprod/verbatim
          ls -lh build/neon-dotprod/verbatim.nn

      # =========================================================
      # BUILD ANDROID ENGINE
      #
      # Halogen's own ARCH=neon-dotprod target provides:
      #
      #   USE_NEON
      #   USE_NEON_DOTPROD
      #   armv8.2-a+dotprod
      #   -O3
      #   -flto
      #
      # We additionally tune the compiler for Cortex-A76.
      # =========================================================
      - name: Build Android engine
        working-directory: src
        shell: bash
        run: |
          make release \
            ARCH=neon-dotprod \
            CXX="$ANDROID_CLANG" \
            EVALFILE="../build/ed164cf2.nn" \
            EXTRA_CXXFLAGS="-mcpu=cortex-a76" \
            EXTRA_LDFLAGS="-static-libstdc++" \
            EXE=../bin/Halogen-Android \
            -j"$(nproc)"

      # =========================================================
      # VERIFY
      # =========================================================
      - name: Verify Android binary
        shell: bash
        run: |
          echo "===== file ====="
          file bin/Halogen-Android

          echo
          echo "===== ELF ====="
          readelf -h bin/Halogen-Android | grep -E \
            "Class:|Machine:"

          echo
          echo "===== size ====="
          ls -lh bin/Halogen-Android

      # =========================================================
      # ARTIFACT
      # =========================================================
      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Halogen-Android-ARM64-NEON-DotProd
          path: bin/Halogen-Android
          if-no-files-found: error
