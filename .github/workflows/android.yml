name: Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  android-arm64:
    name: Android ARM64 NEON DotProd
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # ANDROID SDK / NDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"


      # ============================================================
      # HOST AARCH64 COMPILER + QEMU
      #
      # Used for the Halogen verbatim network preprocessing tool.
      # ============================================================

      - name: Install AArch64 compiler and QEMU
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            qemu-user-static

          echo "AArch64 compiler:"
          which aarch64-linux-gnu-g++

          echo "QEMU:"
          which qemu-aarch64-static


      # ============================================================
      # ANDROID TOOLCHAIN
      # ============================================================

      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD HALOGEN NETWORK
      # ============================================================

      - name: Download Halogen network
        shell: bash
        run: |
          mkdir -p build

          curl -fL \
            "https://github.com/KierenP/Halogen-Networks/releases/download/ed164cf2/ed164cf2.nn" \
            -o build/ed164cf2.nn

          echo "Downloaded network:"
          ls -lh build/ed164cf2.nn


      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare build directories
        shell: bash
        run: |
          mkdir -p build/neon-dotprod
          mkdir -p bin


      # ============================================================
      # ANDROID MEMORY ALLOCATION FIX
      #
      # std::aligned_alloc is not usable with this Android NDK/API
      # combination, so Android uses posix_memalign instead.
      # ============================================================

      - name: Patch Android memory allocation
        working-directory: src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("utility/huge_pages.h")
          text = path.read_text()

          if "#include <cstdlib>" not in text:
              if "#include <cstddef>" in text:
                  text = text.replace(
                      "#include <cstddef>",
                      "#include <cstddef>\n#include <cstdlib>",
                      1
                  )
              else:
                  text = "#include <cstdlib>\n" + text

          old = "T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));"

          new = (
              "#ifdef __ANDROID__\n"
              "    void* aligned_ptr = nullptr;\n"
              "\n"
              "    if (posix_memalign(&aligned_ptr, huge_page_size, size) != 0)\n"
              "        return nullptr;\n"
              "\n"
              "    T* data = static_cast<T*>(aligned_ptr);\n"
              "#else\n"
              "    T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));\n"
              "#endif"
          )

          if old in text:
              text = text.replace(old, new, 1)
              print("Patched std::aligned_alloc for Android.")

          elif "posix_memalign(&aligned_ptr" in text:
              print("Android allocation patch already present.")

          else:
              raise SystemExit(
                  "ERROR: Could not find std::aligned_alloc "
                  "in utility/huge_pages.h"
              )

          path.write_text(text)
          PY

          echo "----- huge_pages.h -----"

          grep -n -A18 -B8 \
            "aligned_alloc\|posix_memalign" \
            utility/huge_pages.h


      # ============================================================
      # BUILD LINUX AARCH64 VERBATIM
      #
      # IMPORTANT:
      #
      # This is NOT the final Android engine.
      #
      # It is the ARM64 Linux helper used to generate verbatim.nn.
      # ============================================================

      - name: Build ARM64 Linux verbatim
        working-directory: src
        shell: bash
        run: |
          rm -f ../build/neon-dotprod/verbatim
          rm -f ../build/neon-dotprod/verbatim.nn

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=c++20 \
            -fno-exceptions \
            -pthread \
            -I. \
            -DUSE_NEON \
            -DUSE_NEON_DOTPROD \
            -march=armv8.2-a+dotprod \
            tools/verbatim.cpp \
            -o ../build/neon-dotprod/verbatim \
            -lm

          chmod +x ../build/neon-dotprod/verbatim

          echo "----- Linux ARM64 verbatim -----"

          file ../build/neon-dotprod/verbatim


      # ============================================================
      # GENERATE ARCHITECTURE-SPECIFIC NETWORK
      #
      # Run the Linux ARM64 helper under QEMU.
      # ============================================================

      - name: Generate NEON DotProd network
        working-directory: src
        shell: bash
        run: |
          qemu-aarch64-static \
            -L /usr/aarch64-linux-gnu \
            ../build/neon-dotprod/verbatim \
            ../build/ed164cf2.nn \
            ../build/neon-dotprod/verbatim.nn

          echo "----- Generated network -----"

          ls -lh ../build/neon-dotprod/verbatim.nn


      # ============================================================
      # VERIFY NETWORK
      # ============================================================

      - name: Verify generated network
        shell: bash
        run: |
          test -s build/neon-dotprod/verbatim.nn

          echo "verbatim.nn exists and is non-empty."

          ls -lh build/neon-dotprod/verbatim.nn


      # ============================================================
      # PATCH HALOGEN MAKEFILE
      #
      # The original Makefile contains:
      #
      # $(VERBATIM_NET): $(VERBATIM) $(EVALFILE) $(FLAGS_STAMP)
      #     ./$(VERBATIM) $(EVALFILE) $@
      #
      # That causes make release to build an Android verbatim
      # executable and then try to execute it on the Linux runner.
      #
      # We already generated the correct ARM64 verbatim.nn above.
      #
      # Replace that rule with a simple existence check.
      # ============================================================

      - name: Disable automatic verbatim regeneration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Makefile")
          text = path.read_text()

          old = """$(VERBATIM_NET): $(VERBATIM) $(EVALFILE) $(FLAGS_STAMP)
\t./$(VERBATIM) $(EVALFILE) $@"""

          new = """$(VERBATIM_NET):
\t@test -s $@ || (echo "ERROR: pre-generated verbatim.nn is missing."; exit 1)
\t@echo "Using pre-generated $@""""

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("SUCCESS: Makefile verbatim generation disabled.")
          elif "Using pre-generated $@" in text:
              print("Makefile patch already present.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected VERBATIM_NET rule "
                  "in src/Makefile."
              )
          PY

          echo
          echo "----- Patched Makefile network section -----"

          sed -n '340,365p' src/Makefile


      # ============================================================
      # BUILD FINAL ANDROID ENGINE
      #
      # This is the REAL engine.
      #
      # ARCH:
      #   neon-dotprod
      #
      # CPU:
      #   Cortex-A76
      #
      # Optimizations:
      #   -O3
      #   -flto
      #   ARMv8.2-A DotProd
      # ============================================================

      - name: Build Android engine
        working-directory: src
        shell: bash
        run: |
          make release \
            ARCH=neon-dotprod \
            CXX="$ANDROID_CLANG" \
            EVALFILE="../build/ed164cf2.nn" \
            EXTRA_CXXFLAGS="-mcpu=cortex-a76" \
            EXTRA_LDFLAGS="-static-libstdc++" \
            EXE=../bin/Halogen-Android \
            -j"$(nproc)"


      # ============================================================
      # VERIFY FINAL BINARY
      # ============================================================

      - name: Verify Android binary
        shell: bash
        run: |
          echo "========================================"
          echo "Halogen Android ARM64"
          echo "========================================"

          file bin/Halogen-Android

          echo
          echo "----- ELF header -----"

          readelf -h bin/Halogen-Android | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "----- Binary size -----"

          ls -lh bin/Halogen-Android


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Halogen-Android-ARM64-NEON-DotProd
          path: bin/Halogen-Android
          if-no-files-found: error
