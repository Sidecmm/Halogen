name: Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  android-arm64:
    name: Android ARM64 NEON DotProd
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # ANDROID SDK / NDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"


      # ============================================================
      # HOST AARCH64 COMPILER + QEMU
      #
      # These are ONLY used for Halogen's verbatim network
      # preprocessing tool.
      # ============================================================

      - name: Install AArch64 compiler and QEMU
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            qemu-user-static

          echo "AArch64 compiler:"
          which aarch64-linux-gnu-g++

          echo "QEMU:"
          which qemu-aarch64-static


      # ============================================================
      # ANDROID TOOLCHAIN
      # ============================================================

      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD NNUE
      # ============================================================

      - name: Download Halogen network
        shell: bash
        run: |
          mkdir -p build

          curl -fL \
            "https://github.com/KierenP/Halogen-Networks/releases/download/ed164cf2/ed164cf2.nn" \
            -o build/ed164cf2.nn

          echo "Network:"
          ls -lh build/ed164cf2.nn


      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare build directories
        shell: bash
        run: |
          mkdir -p build/neon-dotprod
          mkdir -p bin


      # ============================================================
      # ANDROID MEMORY ALLOCATION FIX
      # ============================================================

      - name: Patch Android memory allocation
        working-directory: src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("utility/huge_pages.h")
          text = path.read_text()

          if "#include <cstdlib>" not in text:
              if "#include <cstddef>" in text:
                  text = text.replace(
                      "#include <cstddef>",
                      "#include <cstddef>\n#include <cstdlib>",
                      1
                  )
              else:
                  text = "#include <cstdlib>\n" + text

          old = "T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));"

          new = (
              "#ifdef __ANDROID__\n"
              "    void* aligned_ptr = nullptr;\n"
              "\n"
              "    if (posix_memalign(&aligned_ptr, huge_page_size, size) != 0)\n"
              "        return nullptr;\n"
              "\n"
              "    T* data = static_cast<T*>(aligned_ptr);\n"
              "#else\n"
              "    T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));\n"
              "#endif"
          )

          if old in text:
              text = text.replace(old, new, 1)
              print("Patched std::aligned_alloc for Android.")

          elif "posix_memalign(&aligned_ptr" in text:
              print("Android allocation patch already exists.")

          else:
              raise SystemExit(
                  "ERROR: Could not find std::aligned_alloc line "
                  "in utility/huge_pages.h"
              )

          path.write_text(text)
          PY

          echo "----- huge_pages.h -----"

          grep -n -A18 -B8 \
            "aligned_alloc\|posix_memalign" \
            utility/huge_pages.h


      # ============================================================
      # BUILD VERBATIM FOR LINUX AARCH64
      #
      # IMPORTANT:
      #
      # DO NOT use Android clang here.
      #
      # Halogen's verbatim program must be executable on the
      # GitHub Linux runner, so we build a Linux AArch64 ELF.
      # ============================================================

      - name: Build ARM64 Linux verbatim
        working-directory: src
        shell: bash
        run: |
          rm -f ../build/neon-dotprod/verbatim

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=c++20 \
            -fno-exceptions \
            -pthread \
            -I. \
            -DUSE_NEON \
            -DUSE_NEON_DOTPROD \
            -march=armv8.2-a+dotprod \
            tools/verbatim.cpp \
            -o ../build/neon-dotprod/verbatim \
            -lm

          chmod +x ../build/neon-dotprod/verbatim

          echo "----- verbatim -----"

          file ../build/neon-dotprod/verbatim


      # ============================================================
      # RUN VERBATIM THROUGH QEMU
      # ============================================================

      - name: Generate NEON DotProd network
        working-directory: src
        shell: bash
        run: |
          rm -f ../build/neon-dotprod/verbatim.nn

          qemu-aarch64-static \
            -L /usr/aarch64-linux-gnu \
            ../build/neon-dotprod/verbatim \
            ../build/ed164cf2.nn \
            ../build/neon-dotprod/verbatim.nn

          echo "----- generated verbatim.nn -----"

          ls -lh ../build/neon-dotprod/verbatim.nn


      # ============================================================
      # PREVENT MAKE FROM REBUILDING / RUNNING VERBATIM
      #
      # The normal Halogen Makefile tries to compile verbatim using
      # CXX and then executes it.
      #
      # CXX will later be Android clang++, which would create an
      # Android executable requiring /system/bin/linker64.
      #
      # We therefore modify the Makefile's verbatim command so the
      # already-generated ARM64 network is retained.
      # ============================================================

      - name: Disable Makefile verbatim regeneration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/Makefile")
          text = path.read_text()

          print("Searching Makefile for verbatim rules...")

          lines = text.splitlines()

          for i, line in enumerate(lines):
              if "verbatim.cpp" in line or "verbatim.nn" in line:
                  start = max(0, i - 3)
                  end = min(len(lines), i + 8)

                  print()
                  print("----- Makefile context -----")

                  for n in range(start, end):
                      print(f"{n + 1}: {lines[n]}")

          # --------------------------------------------------------
          # Replace direct execution of the generated verbatim
          # program with a no-op.
          #
          # This catches the exact command that previously appeared:
          #
          # ./../build/neon-dotprod/verbatim ...
          # --------------------------------------------------------

          pattern = r'^(\s*)\./\.\./build/\$\(ARCH\)/verbatim\s+.*$'

          new_lines = []

          changed = False

          for line in lines:
              if re.match(pattern, line):
                  indent = re.match(pattern, line).group(1)

                  new_lines.append(
                      indent
                      + '@echo "Using pre-generated verbatim.nn; skipping host execution."'
                  )

                  changed = True
              else:
                  new_lines.append(line)

          text = "\n".join(new_lines) + "\n"

          if changed:
              path.write_text(text)
              print()
              print("Patched Makefile: verbatim execution disabled.")
          else:
              print()
              print("No direct ARCH verbatim execution line matched.")
              print("The build will be inspected before continuing.")

          PY

          echo "----- Relevant Makefile lines -----"

          grep -n -A8 -B5 \
            "verbatim.cpp\|verbatim.nn\|verbatim" \
            src/Makefile || true


      # ============================================================
      # BUILD ANDROID ENGINE
      #
      # NOW CXX IS ANDROID CLANG.
      #
      # The verbatim program is NOT supposed to execute anymore.
      #
      # Final target:
      #   Android ARM64
      #   NEON
      #   DotProd
      #   Cortex-A76
      #   O3
      #   LTO
      # ============================================================

      - name: Build Android engine
        working-directory: src
        shell: bash
        run: |
          make release \
            ARCH=neon-dotprod \
            CXX="$ANDROID_CLANG" \
            EVALFILE="../build/neon-dotprod/verbatim.nn" \
            EXTRA_CXXFLAGS="-mcpu=cortex-a76" \
            EXTRA_LDFLAGS="-static-libstdc++" \
            EXE=../bin/Halogen-Android \
            -j"$(nproc)"


      # ============================================================
      # VERIFY FINAL ANDROID BINARY
      # ============================================================

      - name: Verify Android binary
        shell: bash
        run: |
          echo "========================================"
          echo "ANDROID BINARY"
          echo "========================================"

          file bin/Halogen-Android

          echo
          echo "========================================"
          echo "ELF HEADER"
          echo "========================================"

          readelf -h bin/Halogen-Android | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "========================================"
          echo "BINARY SIZE"
          echo "========================================"

          ls -lh bin/Halogen-Android


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Halogen-Android-ARM64-NEON-DotProd
          path: bin/Halogen-Android
          if-no-files-found: error
