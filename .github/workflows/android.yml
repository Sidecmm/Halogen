name: Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  android-arm64:
    name: Android ARM64 NEON DotProd
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ------------------------------------------------------------
      # 3. Android NDK
      # ------------------------------------------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ------------------------------------------------------------
      # 4. Linux AArch64 compiler + QEMU
      #
      # We need a Linux ARM64 version of Halogen's "verbatim"
      # tool because the normal Android version cannot execute
      # on the GitHub Actions Linux host.
      # ------------------------------------------------------------
      - name: Install AArch64 compiler and QEMU
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            qemu-user-static

          echo "AArch64 compiler:"
          which aarch64-linux-gnu-g++

          echo "QEMU:"
          which qemu-aarch64-static

      # ------------------------------------------------------------
      # 5. Configure Android toolchain
      # ------------------------------------------------------------
      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

          echo "NDK: $NDK"
          echo "Android compiler:"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" --version

      # ------------------------------------------------------------
      # 6. Download Halogen network
      # ------------------------------------------------------------
      - name: Download Halogen network
        shell: bash
        run: |
          mkdir -p build

          curl -fL \
            "https://github.com/KierenP/Halogen-Networks/releases/download/ed164cf2/ed164cf2.nn" \
            -o build/ed164cf2.nn

          echo "Downloaded network:"
          ls -lh build/ed164cf2.nn

      # ------------------------------------------------------------
      # 7. Prepare directories
      # ------------------------------------------------------------
      - name: Prepare build directories
        shell: bash
        run: |
          mkdir -p build/neon-dotprod
          mkdir -p bin

      # ------------------------------------------------------------
      # 8. Fix Android aligned allocation
      #
      # Android NDK API 24 does not provide the std::aligned_alloc
      # implementation expected by Halogen's huge_pages.h.
      #
      # Use posix_memalign on Android.
      # ------------------------------------------------------------
      - name: Patch Android memory allocation
        working-directory: src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("utility/huge_pages.h")
          text = path.read_text()

          # Make sure <cstdlib> is available.
          if "#include <cstdlib>" not in text:
              if "#include <cstddef>" in text:
                  text = text.replace(
                      "#include <cstddef>",
                      "#include <cstddef>\n#include <cstdlib>",
                      1
                  )
              else:
                  text = "#include <cstdlib>\n" + text

          old = "T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));"

          new = (
              "#ifdef __ANDROID__\n"
              "    void* aligned_ptr = nullptr;\n"
              "\n"
              "    if (posix_memalign(&aligned_ptr, huge_page_size, size) != 0)\n"
              "        return nullptr;\n"
              "\n"
              "    T* data = static_cast<T*>(aligned_ptr);\n"
              "#else\n"
              "    T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));\n"
              "#endif"
          )

          if old in text:
              text = text.replace(old, new, 1)
              print("Patched std::aligned_alloc for Android.")
          elif "posix_memalign(&aligned_ptr" in text:
              print("Android allocation patch already present.")
          else:
              raise SystemExit(
                  "ERROR: Could not find std::aligned_alloc "
                  "in utility/huge_pages.h"
              )

          path.write_text(text)
          PY

          echo "---- Allocation code ----"
          grep -n -A18 -B8 \
            "aligned_alloc\|posix_memalign" \
            utility/huge_pages.h

      # ------------------------------------------------------------
      # 9. Build Linux ARM64 version of verbatim
      #
      # IMPORTANT:
      # This is NOT the Android binary.
      #
      # It is a Linux AArch64 executable that QEMU can execute
      # on the GitHub Actions x86_64 runner.
      # ------------------------------------------------------------
      - name: Build ARM64 Linux verbatim
        working-directory: src
        shell: bash
        run: |
          rm -f ../build/neon-dotprod/verbatim
          rm -f ../build/neon-dotprod/verbatim.nn

          aarch64-linux-gnu-g++ \
            -O3 \
            -std=c++20 \
            -fno-exceptions \
            -pthread \
            -I. \
            -DUSE_NEON \
            -DUSE_NEON_DOTPROD \
            -march=armv8.2-a+dotprod \
            tools/verbatim.cpp \
            -o ../build/neon-dotprod/verbatim \
            -lm

          chmod +x ../build/neon-dotprod/verbatim

          echo "---- verbatim binary ----"
          file ../build/neon-dotprod/verbatim

      # ------------------------------------------------------------
      # 10. Generate verbatim.nn under QEMU
      # ------------------------------------------------------------
      - name: Generate NEON DotProd network
        working-directory: src
        shell: bash
        run: |
          echo "Generating verbatim.nn..."

          qemu-aarch64-static \
            -L /usr/aarch64-linux-gnu \
            ../build/neon-dotprod/verbatim \
            ../build/ed164cf2.nn \
            ../build/neon-dotprod/verbatim.nn

          echo "---- Generated network ----"
          ls -lh ../build/neon-dotprod/verbatim.nn

      # ------------------------------------------------------------
      # 11. Verify network
      # ------------------------------------------------------------
      - name: Verify generated network
        shell: bash
        run: |
          test -s build/neon-dotprod/verbatim.nn

          echo "verbatim.nn successfully generated:"
          ls -lh build/neon-dotprod/verbatim.nn

      # ------------------------------------------------------------
      # 12. Disable Makefile's automatic verbatim generation
      #
      # This is the critical fix.
      #
      # Normally Makefile does:
      #
      #   Android verbatim -> execute verbatim -> linker64 error
      #
      # We instead use the Linux ARM64/QEMU-generated network.
      # ------------------------------------------------------------
      - name: Disable automatic verbatim regeneration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Makefile")
          text = path.read_text()

          old = (
              "$(VERBATIM_NET): $(VERBATIM) $(EVALFILE) $(FLAGS_STAMP)\n"
              "\t./$(VERBATIM) $(EVALFILE) $@"
          )

          new = (
              "$(VERBATIM_NET):\n"
              "\t@test -s $@ || (echo \"ERROR: pre-generated verbatim.nn is missing.\"; exit 1)\n"
              "\t@echo \"Using pre-generated $@\""
          )

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("SUCCESS: Makefile verbatim generation disabled.")

          elif "Using pre-generated $@" in text:
              print("Makefile patch already present.")

          else:
              raise SystemExit(
                  "ERROR: Could not find the expected VERBATIM_NET rule "
                  "in src/Makefile."
              )
          PY

          echo "---- Patched Makefile ----"
          sed -n '340,365p' src/Makefile

      # ------------------------------------------------------------
      # 13. Build Android ARM64 NEON + DotProd engine
      # ------------------------------------------------------------
      - name: Build Android engine
        working-directory: src
        shell: bash
        run: |
          echo "Building Halogen for Android ARM64 NEON DotProd..."

          make release \
            ARCH=neon-dotprod \
            CXX="$ANDROID_CLANG" \
            EVALFILE="../build/ed164cf2.nn" \
            EXTRA_CXXFLAGS="-mcpu=cortex-a76" \
            EXTRA_LDFLAGS="-static-libstdc++" \
            EXE=../bin/Halogen-Android \
            -j"$(nproc)"

      # ------------------------------------------------------------
      # 14. Verify resulting binary
      # ------------------------------------------------------------
      - name: Verify Android binary
        shell: bash
        run: |
          echo "---- Binary information ----"

          file bin/Halogen-Android

          echo
          echo "---- ELF header ----"

          readelf -h bin/Halogen-Android | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "---- Binary size ----"

          ls -lh bin/Halogen-Android

          echo
          echo "---- Architecture ----"

          readelf -A bin/Halogen-Android || true

      # ------------------------------------------------------------
      # 15. Upload engine
      # ------------------------------------------------------------
      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Halogen-Android-ARM64-NEON-DotProd
          path: bin/Halogen-Android
          if-no-files-found: error
