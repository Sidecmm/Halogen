name: Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  android-arm64:
    name: Android ARM64 NEON DotProd
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Android SDK / NDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ------------------------------------------------------------
      # Host AArch64 compiler + QEMU
      #
      # Used only to build/run Halogen's verbatim tool.
      # The final engine is built with the Android NDK.
      # ------------------------------------------------------------
      - name: Install AArch64 compiler and QEMU
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            qemu-user-static

          which aarch64-linux-gnu-g++
          which qemu-aarch64-static

      # ------------------------------------------------------------
      # Configure Android toolchain
      # ------------------------------------------------------------
      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Download Halogen NNUE network
      # ------------------------------------------------------------
      - name: Download Halogen network
        shell: bash
        run: |
          mkdir -p build

          curl -fL \
            "https://github.com/KierenP/Halogen-Networks/releases/download/ed164cf2/ed164cf2.nn" \
            -o build/ed164cf2.nn

          ls -lh build/ed164cf2.nn

      # ------------------------------------------------------------
      # Prepare build directories
      # ------------------------------------------------------------
      - name: Prepare build directories
        shell: bash
        run: |
          mkdir -p build/neon-dotprod
          mkdir -p bin

      # ------------------------------------------------------------
      # Android does not provide std::aligned_alloc correctly
      # for this NDK/API combination.
      #
      # Replace it with posix_memalign on Android.
      # ------------------------------------------------------------
      - name: Patch Android memory allocation
        working-directory: src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("utility/huge_pages.h")
          text = path.read_text()

          # Make sure cstdlib is included.
          if "#include <cstdlib>" not in text:
              if "#include <cstddef>" in text:
                  text = text.replace(
                      "#include <cstddef>",
                      "#include <cstddef>\n#include <cstdlib>",
                      1
                  )
              else:
                  text = "#include <cstdlib>\n" + text

          old = "T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));"

          new = (
              "#ifdef __ANDROID__\n"
              "    void* aligned_ptr = nullptr;\n"
              "\n"
              "    if (posix_memalign(&aligned_ptr, huge_page_size, size) != 0)\n"
              "        return nullptr;\n"
              "\n"
              "    T* data = static_cast<T*>(aligned_ptr);\n"
              "#else\n"
              "    T* data = static_cast<T*>(std::aligned_alloc(huge_page_size, size));\n"
              "#endif"
          )

          if old in text:
              text = text.replace(old, new, 1)
              print("Patched std::aligned_alloc for Android.")

          elif "posix_memalign(&aligned_ptr" in text:
              print("Android aligned allocation patch already present.")

          else:
              raise SystemExit(
                  "ERROR: Could not find the expected aligned_alloc line "
                  "in utility/huge_pages.h"
              )

          path.write_text(text)
          PY

          echo "----- Patched huge_pages.h -----"
          grep -n -A18 -B8 \
            "aligned_alloc\|posix_memalign" \
            utility/huge_pages.h

      # ------------------------------------------------------------
      # Build Halogen's verbatim tool for ARM64 Linux.
      #
      # It needs ARM NEON headers, so it cannot be built with
      # normal x86_64 g++.
      # ------------------------------------------------------------
      - name: Build ARM64 verbatim tool
        working-directory: src
        shell: bash
        run: |
          aarch64-linux-gnu-g++ \
            -O3 \
            -std=c++20 \
            -fno-exceptions \
            -pthread \
            -I. \
            -DUSE_NEON \
            -DUSE_NEON_DOTPROD \
            -march=armv8.2-a+dotprod \
            tools/verbatim.cpp \
            -o ../build/neon-dotprod/verbatim \
            -lm

          echo "----- Verbatim binary -----"
          file ../build/neon-dotprod/verbatim

      # ------------------------------------------------------------
      # Run ARM64 verbatim tool through QEMU.
      #
      # This generates the architecture-specific embedded NNUE
      # representation required by Halogen.
      # ------------------------------------------------------------
      - name: Generate NEON DotProd network
        working-directory: src
        shell: bash
        run: |
          chmod +x ../build/neon-dotprod/verbatim

          qemu-aarch64-static \
            -L /usr/aarch64-linux-gnu \
            ../build/neon-dotprod/verbatim \
            ../build/ed164cf2.nn \
            ../build/neon-dotprod/verbatim.nn

          echo "----- Generated network -----"
          ls -lh ../build/neon-dotprod/verbatim.nn

      # ------------------------------------------------------------
      # Make sure the build system sees the generated files.
      # ------------------------------------------------------------
      - name: Prepare Halogen verbatim files
        shell: bash
        run: |
          touch build/neon-dotprod/verbatim
          touch build/neon-dotprod/verbatim.nn

          echo "----- Build files -----"
          ls -lh \
            build/neon-dotprod/verbatim \
            build/neon-dotprod/verbatim.nn

      # ------------------------------------------------------------
      # Build Android ARM64 engine
      #
      # ARCH=neon-dotprod:
      #   USE_NEON
      #   USE_NEON_DOTPROD
      #   -march=armv8.2-a+dotprod
      #
      # cortex-a76:
      #   optimized scheduling/tuning for ARM Cortex-A76-class CPUs
      #
      # O3 + LTO:
      #   aggressive compiler optimization
      # ------------------------------------------------------------
      - name: Build Android engine
        working-directory: src
        shell: bash
        run: |
          make release \
            ARCH=neon-dotprod \
            CXX="$ANDROID_CLANG" \
            EVALFILE="../build/ed164cf2.nn" \
            EXTRA_CXXFLAGS="-mcpu=cortex-a76" \
            EXTRA_LDFLAGS="-static-libstdc++" \
            EXE=../bin/Halogen-Android \
            -j"$(nproc)"

      # ------------------------------------------------------------
      # Verify resulting binary
      # ------------------------------------------------------------
      - name: Verify Android binary
        shell: bash
        run: |
          echo "----- Binary information -----"

          file bin/Halogen-Android

          echo "----- ELF information -----"

          readelf -h bin/Halogen-Android | grep -E \
            "Class:|Machine:"

          echo "----- Binary size -----"

          ls -lh bin/Halogen-Android

      # ------------------------------------------------------------
      # Upload final engine
      # ------------------------------------------------------------
      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Halogen-Android-ARM64-NEON-DotProd
          path: bin/Halogen-Android
          if-no-files-found: error
